version: '3.8'

services:
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: entangled-echo-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-dev-ai-service-shared-secret}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
